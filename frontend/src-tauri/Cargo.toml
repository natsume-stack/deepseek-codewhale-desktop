[package]
name = "codewhale-desktop"
version = "0.1.0"
description = "CodeWhale Desktop (Tauri shell)"
authors = ["CodeWhale"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "codewhale_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
